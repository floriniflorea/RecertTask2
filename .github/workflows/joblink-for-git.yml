name: "JobRouter Git-Integration"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  jr_process_name: "RecertTask4"
  jr_process_version: "1"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Initial Commit from JobRouter Process') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Validate required secrets
        run: |
          missing_params=()
          [ -z "${{ secrets.JR_URL }}" ]      && missing_params+=("JR_URL")
          [ -z "${{ secrets.JR_USERNAME }}" ] && missing_params+=("JR_USERNAME")
          [ -z "${{ secrets.JR_PASSWORD }}" ] && missing_params+=("JR_PASSWORD")
          if [ ${#missing_params[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing_params[*]}"
            exit 1
          fi

      - name: Validate PHP script exists
        run: |
          if [ ! -f "./build/push-to-jobrouter.php" ]; then
            echo "::error::push-to-jobrouter.php not found"
            exit 1
          fi

      - name: Call JobRouter to update process assets
        run: |
          php ./build/push-to-jobrouter.php \
            "${{ env.jr_process_name }}" \
            "${{ env.jr_process_version }}" \
            "${{ secrets.JR_URL }}" \
            "${{ secrets.JR_USERNAME }}" \
            "${{ secrets.JR_PASSWORD }}"